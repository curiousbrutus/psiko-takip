version: '3.8'

services:
  # Oracle Database XE
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: psikotakip-oracle
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=OraclePassword123
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database:/docker-entrypoint-initdb.d/startup
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/OraclePassword123@//localhost:1521/XE", "@healthcheck.sql"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - psikotakip-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psikotakip-app
    ports:
      - "9002:9002"
    environment:
      - NODE_ENV=development
      - ORACLE_USER=psikotakip_user
      - ORACLE_PASSWORD=SecurePassword123
      - ORACLE_CONNECTION_STRING=oracle-db:1521/XEPDB1
      - ORACLE_POOL_MIN=2
      - ORACLE_POOL_MAX=10
      - JWT_SECRET=dev-jwt-secret-change-in-production-32chars
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production-32
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - psikotakip-network
    command: npm run dev

  # pgAdmin (for database management - optional)
  # Uncomment if you want a web UI for database management
  # adminer:
  #   image: adminer:latest
  #   container_name: psikotakip-adminer
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - ADMINER_DEFAULT_SERVER=oracle-db
  #   networks:
  #     - psikotakip-network

networks:
  psikotakip-network:
    driver: bridge

volumes:
  oracle-data:
    driver: local
